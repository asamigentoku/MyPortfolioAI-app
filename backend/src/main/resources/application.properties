spring.application.name=backend

# Supabase (PostgreSQL)
spring.datasource.url=${DATABASE_URL}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

#ヘルスチェック
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.health.redis.enabled=false
# ALB用 liveness グループ（DB/Redisに依存せず、アプリ起動確認のみ）
management.endpoint.health.group.liveness.include=ping
management.endpoint.health.group.liveness.show-details=never


# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Google / Groq
google.client-id=${GOOGLE_CLIENT_ID}
groq.api-key=${GROQ_API_KEY}
groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}


# Redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
# Redis接続タイムアウトの調整
spring.data.redis.timeout=10000
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

# JWT
jwt.secret=${JWT_SECRET}

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

#ログ解析用
# Tomcatのアクセスログを有効にする
server.tomcat.accesslog.enabled=true

# ログを標準出力（STDOUT）に流すことで、CloudWatch Logsで見られるようにする
server.tomcat.accesslog.buffered=false
server.tomcat.accesslog.directory=/dev
server.tomcat.accesslog.prefix=stdout
server.tomcat.accesslog.suffix=
server.tomcat.accesslog.pattern=%h %l %u %t "%r" %s %b "%{Referer}i" "%{User-Agent}i"